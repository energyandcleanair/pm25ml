# Promotes the image ci.yml already pushed for this commit.
# Does not build or test. Fails when pm25ml:<sha> is not in Artifact Registry.

name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

env:
  GOOGLE_SERVICE_ACCOUNT_NAME: crea-india-map-github-actions@vital-form-455413-p8.iam.gserviceaccount.com
  ORCHESTRATOR_SERVICE_ACCOUNT_NAME: pm25ml-orchestrator@vital-form-455413-p8.iam.gserviceaccount.com
  GCP_PROJECT: vital-form-455413-p8
  WORKFLOW_IDENTITY_PROVIDER: 'projects/716476042137/locations/global/workloadIdentityPools/github-wif-pool/providers/crea-org-actions-provider'
  IMAGE_TAG_BASE: europe-west1-docker.pkg.dev/vital-form-455413-p8/pm25ml/pm25ml

permissions:
  id-token: write
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    concurrency:
      group: release-tag
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Check tag shape
        run: |
          echo "${{ github.ref_name }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
      - name: Authenticate with Google Cloud
        uses: 'google-github-actions/auth@v2'
        with:
          project_id: ${{ env.GCP_PROJECT }}
          service_account: ${{ env.GOOGLE_SERVICE_ACCOUNT_NAME }}
          workload_identity_provider: ${{ env.WORKFLOW_IDENTITY_PROVIDER }}
          export_environment_variables: true
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
      - name: Require the image built for this commit
        run: |
          image="${{ env.IMAGE_TAG_BASE }}:${{ github.sha }}"
          if ! gcloud container images describe "$image" >/dev/null; then
            echo "::error::No image at ${image}. The main workflow must already have pushed this commit."
            exit 1
          fi
          echo "Promoting existing image ${image}"
      - name: Tag built image as the model bundle
        run: |
          gcloud container images add-tag \
          ${{ env.IMAGE_TAG_BASE }}:${{ github.sha }} \
          ${{ env.IMAGE_TAG_BASE }}:v${{ github.ref_name }}
      - name: Render release workflow and job
        run: |
          python3 .ci/scripts/render_release_workflow.py release \
            --version "${{ github.ref_name }}" \
            --workflow-out /tmp/workflow-release.yaml \
            --job-out /tmp/run-release.yaml
      - name: Deploy release job spec
        run: gcloud run jobs replace /tmp/run-release.yaml
      - name: Deploy release workflow
        run: |
          gcloud workflows deploy pm25ml-orchestrator-release \
            --source=/tmp/workflow-release.yaml \
            --location=europe-west1 \
            --service-account=${{ env.ORCHESTRATOR_SERVICE_ACCOUNT_NAME }} \
            --call-log-level=LOG_ALL_CALLS \
            --execution-history-level=execution-history-detailed \
            --quiet
